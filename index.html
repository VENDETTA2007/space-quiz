<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10152b">
  <title>Orbit — Space Quiz</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #10152b;
      --surface: #191f3b;
      --surface-raised: #222949;
      --text: #f4f4ff;
      --muted: #a7aecb;
      --line: #343c60;
      --purple: #a78bfa;
      --pink: #ff83c5;
      --green: #63e6a3;
      --red: #ff7185;
      --control-accent: #67e8f9;
      --control-surface: #1b2540;
      --control-border: #415172;
      --panel-grid: #ffffff05;
      --panel-wash: #67e8f908;
      --shadow: 0 24px 80px #070a1980;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 14%, #6545a52b, transparent 30rem),
        radial-gradient(ellipse at 90% 82%, #e8519d1c, transparent 28rem),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .quiz-shell { width: min(100%, 560px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid #a78bfa75;
      border-radius: 50%;
      color: #e3d8ff;
      background: #a78bfa20;
      font-size: 17px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 100% 0, var(--panel-wash), transparent 48%),
        repeating-linear-gradient(0deg, var(--panel-grid) 0 1px, transparent 1px 32px),
        repeating-linear-gradient(90deg, var(--panel-grid) 0 1px, transparent 1px 32px),
        var(--surface);
      box-shadow: inset 0 1px #ffffff12, 0 0 0 4px #67e8f908, var(--shadow);
    }

    .card-content { padding: clamp(24px, 6vw, 38px); }

    #quiz-screen {
      position: relative;
      background: linear-gradient(145deg, #67e8f905, transparent 42%);
    }

    #quiz-screen::before {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 23px;
      height: 23px;
      border-top: 1px solid var(--control-accent);
      border-right: 1px solid var(--control-accent);
      content: "";
      opacity: .65;
      pointer-events: none;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -4px 0 17px;
      padding: 0 0 12px;
      border-bottom: 1px solid var(--control-border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: .035em;
    }

    .question-number::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--control-accent);
      box-shadow: 0 0 9px var(--control-accent);
      content: "";
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--control-border);
      border-radius: 6px;
      color: var(--text);
      background: var(--panel-wash);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .score-star { color: #ffd166; }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: 3px;
      background: #ffffff0b;
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      background:
        repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--surface) calc(10% - 2px) 10%),
        linear-gradient(90deg, var(--control-accent), var(--purple));
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 26px 0 9px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    #quiz-screen .eyebrow::before {
      width: 5px;
      height: 5px;
      border-radius: 1px;
      background: var(--purple);
      box-shadow: 0 0 8px var(--purple);
      content: "";
      transform: rotate(45deg);
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 25px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.25;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 11px;
    }

    .answer {
      position: relative;
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 42px 12px 17px;
      overflow: hidden;
      border: 1px solid var(--control-border);
      border-radius: 9px;
      color: var(--text);
      background:
        linear-gradient(90deg, transparent 0 44px, #ffffff08 44px 45px, transparent 45px),
        linear-gradient(0deg, #ffffff04 1px, transparent 1px),
        var(--control-surface);
      background-size: auto, 100% 8px, auto;
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .answer::before {
      position: absolute;
      inset: 9px auto 9px 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: transparent;
      content: "";
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }

    .answer::after {
      position: absolute;
      top: 50%;
      right: 16px;
      width: 8px;
      height: 8px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      content: "";
      opacity: .7;
      transform: translateY(-50%);
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--control-accent);
      background-color: #67e8f90a;
      box-shadow: inset 0 0 22px #67e8f90d, 0 0 14px #67e8f918;
    }

    .answer:hover:not(:disabled)::before,
    .answer:focus-visible::before {
      background: var(--control-accent);
      box-shadow: 0 0 10px var(--control-accent);
    }

    .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
      outline: 3px solid var(--control-accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 1px solid #67e8f944;
      border-radius: 5px;
      color: var(--control-accent);
      background: #67e8f90a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .answer.correct {
      border-color: #63e6a3a6;
      background-color: #36c98020;
      animation: glow-in 480ms ease both;
    }

    .answer.correct::before { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .answer.correct::after {
      width: auto;
      height: auto;
      border: 0;
      color: var(--green);
      content: "✓";
      font-size: 15px;
      font-weight: 800;
      opacity: 1;
    }

    .answer.correct .answer-key { border-color: #63e6a37a; color: var(--green); background: #63e6a314; }

    .answer.wrong {
      border-color: #ff7185b3;
      background-color: #ff526719;
      animation: shake 420ms ease both;
    }

    .answer.wrong::before { background: var(--red); box-shadow: 0 0 10px var(--red); }
    .answer.wrong::after {
      width: auto;
      height: auto;
      border: 0;
      color: var(--red);
      content: "×";
      font-size: 17px;
      font-weight: 800;
      opacity: 1;
    }

    .answer.wrong .answer-key { border-color: #ff71856b; color: var(--red); background: #ff718514; }

    .feedback {
      min-height: 25px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .feedback.success { color: var(--green); font-weight: 650; }
    .feedback.error { color: #ff9aa8; }

    .action-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .next-button, .restart-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 47px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      color: #171327;
      background: linear-gradient(110deg, #c4b5fd, #ff9bd1);
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .next-button:hover, .restart-button:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .next-button[hidden] { display: none; }

    .result-screen { padding: clamp(32px, 7vw, 50px) clamp(24px, 6vw, 38px); text-align: center; }
    .result-emoji {
      display: grid;
      width: 94px;
      height: 94px;
      place-items: center;
      margin: 2px auto 23px;
      border: 1px solid #c4b5fd45;
      border-radius: 28px;
      background: linear-gradient(145deg, #a78bfa25, #ff83c51c);
      font-size: 51px;
      animation: float-in 650ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .result-screen .eyebrow { margin-top: 0; }
    .result-screen h1 { margin-bottom: 10px; font-size: clamp(27px, 6vw, 34px); }
    .result-copy { max-width: 360px; margin: 0 auto 23px; color: var(--muted); }
    .result-score { margin-bottom: 25px; color: #e8ddff; font-size: 17px; font-weight: 700; }
    .restart-button { min-width: 165px; }

    .footer-note {
      margin: 18px 0 0;
      color: #9299b7;
      font-size: 12px;
      text-align: center;
    }

    [hidden] { display: none !important; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    @keyframes glow-in {
      0% { box-shadow: 0 0 0 0 #63e6a300; }
      55% { box-shadow: 0 0 22px 2px #63e6a34a; }
      100% { box-shadow: 0 0 12px 0 #63e6a31c; }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translateY(12px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #f1effb;
        --surface: #ffffff;
        --surface-raised: #f7f6fc;
        --text: #24213a;
        --muted: #696781;
        --line: #e2dfef;
        --purple: #7354ce;
        --control-accent: #176f86;
        --control-surface: #f5f8fc;
        --control-border: #cbd6e3;
        --panel-grid: #24213a08;
        --panel-wash: #176f8608;
        --shadow: 0 24px 70px #3122631a;
      }

      .brand-mark { color: #6447bd; }
      .question-number { color: #514d6c; }
      .score-pill { background: #f5f2ff; }
      .progress-track { background: #e9e5f4; }
      .answer { background-image: linear-gradient(90deg, transparent 0 44px, #24213a0c 44px 45px, transparent 45px), linear-gradient(0deg, #24213a08 1px, transparent 1px); }
      .answer:hover:not(:disabled) { background-color: #eaf5f8; }
      .answer.correct { color: #165f3c; background-color: #e9fbf1; }
      .answer.wrong { color: #9c2f42; background-color: #fff0f2; }
      .feedback.error { color: #a63043; }
      .footer-note { color: #77738d; }
      .result-score { color: #58428f; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz-shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit / Space Quiz</div>

    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz-screen" class="card-content">
        <div class="topline">
          <span id="question-number" class="question-number">Question 1 of 10</span>
          <span class="score-pill"><span class="score-star" aria-hidden="true">★</span> Score <span id="score">0</span></span>
        </div>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="Quiz progress"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <p class="eyebrow">Mission briefing</p>
        <h1 id="question" tabindex="-1"></h1>
        <div id="answers" class="answers" role="group" aria-labelledby="question"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <div class="action-row">
          <button id="next-button" class="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>

      <div id="result-screen" class="result-screen" hidden>
        <div id="result-emoji" class="result-emoji" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">Stellar work!</h1>
        <p id="result-copy" class="result-copy"></p>
        <p id="result-score" class="result-score"></p>
        <button id="restart-button" class="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
    <p class="footer-note">10 questions · 1 small step for your brain</p>
  </main>

  <script>
    const questions = [
      {
        prompt: "Which planet is known as the Red Planet?",
        choices: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1
      },
      {
        prompt: "What was the first artificial satellite to orbit Earth?",
        choices: ["Explorer 1", "Apollo 11", "Sputnik 1", "Voyager 1"],
        answer: 2
      },
      {
        prompt: "Which NASA mission first landed humans on the Moon?",
        choices: ["Apollo 8", "Apollo 11", "Gemini 4", "Artemis I"],
        answer: 1
      },
      {
        prompt: "What is the name of the galaxy that contains our Solar System?",
        choices: ["Andromeda", "Whirlpool", "Sombrero", "Milky Way"],
        answer: 3
      },
      {
        prompt: "Which planet has the most prominent ring system?",
        choices: ["Saturn", "Neptune", "Uranus", "Jupiter"],
        answer: 0
      },
      {
        prompt: "What is the largest planet in our Solar System?",
        choices: ["Earth", "Saturn", "Jupiter", "Neptune"],
        answer: 2
      },
      {
        prompt: "Which space telescope launched in 1990 and orbits Earth?",
        choices: ["Kepler", "Hubble", "Chandra", "James Webb"],
        answer: 1
      },
      {
        prompt: "About how long does sunlight take to reach Earth?",
        choices: ["8 minutes", "8 seconds", "1 hour", "24 minutes"],
        answer: 0
      },
      {
        prompt: "What is the name of the first human to travel into space?",
        choices: ["Neil Armstrong", "Buzz Aldrin", "John Glenn", "Yuri Gagarin"],
        answer: 3
      },
      {
        prompt: "Which rover became the first to explore Mars?",
        choices: ["Curiosity", "Perseverance", "Sojourner", "Opportunity"],
        answer: 2
      }
    ];

    const quizScreen = document.querySelector("#quiz-screen");
    const resultScreen = document.querySelector("#result-screen");
    const questionNumber = document.querySelector("#question-number");
    const progressTrack = document.querySelector("#progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const scoreDisplay = document.querySelector("#score");
    const questionHeading = document.querySelector("#question");
    const answersContainer = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const restartButton = document.querySelector("#restart-button");
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const current = questions[questionIndex];
      questionNumber.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
      progressTrack.setAttribute("aria-valuenow", String(questionIndex));
      progressFill.style.width = `${(questionIndex / questions.length) * 100}%`;
      questionHeading.textContent = current.prompt;
      answersContainer.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      answered = false;

      current.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-key" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${choice}</span>`;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersContainer.append(button);
      });
    }

    function selectAnswer(selectedIndex, selectedButton) {
      if (answered) return;
      answered = true;
      const correctIndex = questions[questionIndex].answer;
      const buttons = answersContainer.querySelectorAll(".answer");
      buttons.forEach(button => { button.disabled = true; });

      if (selectedIndex === correctIndex) {
        score += 1;
        scoreDisplay.textContent = String(score);
        selectedButton.classList.add("correct");
        feedback.textContent = "Correct! You're on a stellar trajectory.";
        feedback.classList.add("success");
      } else {
        selectedButton.classList.add("wrong");
        buttons[correctIndex].classList.add("correct");
        feedback.textContent = `Not quite — the answer is ${questions[questionIndex].choices[correctIndex]}.`;
        feedback.classList.add("error");
      }

      progressTrack.setAttribute("aria-valuenow", String(questionIndex + 1));
      progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
      nextButton.textContent = questionIndex === questions.length - 1 ? "See your results" : "Next question";
      nextButton.append(document.createElement("span"));
      nextButton.lastElementChild.setAttribute("aria-hidden", "true");
      nextButton.lastElementChild.textContent = "→";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizScreen.hidden = true;
      resultScreen.hidden = false;
      const percentage = score / questions.length;
      let emoji;
      let title;
      let message;

      if (percentage === 1) {
        emoji = "🏆";
        title = "Out of this world!";
        message = "A perfect mission. The cosmos is impressed.";
      } else if (percentage >= 0.7) {
        emoji = "🚀";
        title = "Stellar work!";
        message = "You've got serious space smarts. Keep exploring!";
      } else if (percentage >= 0.4) {
        emoji = "🪐";
        title = "Nice orbit!";
        message = "You found your way around the stars. There's more to discover!";
      } else {
        emoji = "🌱";
        title = "Ready for liftoff?";
        message = "Every explorer starts somewhere. Take another trip through the stars!";
      }

      document.querySelector("#result-emoji").textContent = emoji;
      document.querySelector("#result-title").textContent = title;
      document.querySelector("#result-copy").textContent = message;
      document.querySelector("#result-score").textContent = `You scored ${score} out of ${questions.length}`;
      restartButton.focus();
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex === questions.length - 1) {
        showResults();
        return;
      }
      questionIndex += 1;
      renderQuestion();
      questionHeading.focus();
    });

    restartButton.addEventListener("click", () => {
      questionIndex = 0;
      score = 0;
      scoreDisplay.textContent = "0";
      resultScreen.hidden = true;
      quizScreen.hidden = false;
      renderQuestion();
      questionHeading.focus();
    });

    renderQuestion();
  </script>
</body>
</html>
